<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="安崎 (An Qi) fan universe: songs, live stages and MVs, linking to Spotify, YouTube, Bilibili and Chinese music apps.">
<link rel="icon" href="artist/avatar.jpg">
<title>安崎 Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;600;700;900&family=Unbounded:wght@300;500;600&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{
  /* Layout: the home view is a star system (安崎 at the core, one orbit per year, one planet per song); every other view is a page of the star chart reached from the top bar */
  --void:#05060c;
  --panel:#0d1022;
  --line:rgba(190,204,255,.13);
  --line-2:rgba(190,204,255,.3);
  --star:#eceefa;
  --mist:#c4c9e0;
  --dust:#9399b9;
  --ice:#a6dcff;
  --flare:#ffc58a;
  --ink-on-ice:#05101c;
  --f-display:"Unbounded","Be Vietnam Pro",system-ui,sans-serif;
  --f-cjk:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{background:var(--void)}
body{background:var(--void);color:var(--star);font:400 15px/1.6 var(--f-body);overflow-x:clip}
a{color:inherit}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}

.sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(55vmax 40vmax at 88% 4%,rgba(166,220,255,.08),transparent 65%),
    radial-gradient(45vmax 35vmax at 2% 72%,rgba(255,197,138,.05),transparent 65%)}
.sky canvas{display:block;width:100%;height:100%}
.page{position:relative;z-index:1}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{margin:0;font:500 11px/1.5 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dust);overflow-wrap:anywhere}
.cjk{font-family:var(--f-cjk)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(5,6,12,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;color:var(--star);text-decoration:none}
.brand .cjk{font-weight:900;font-size:22px;line-height:1}
.brand .latin{font:300 10.5px/1 var(--f-display);letter-spacing:.32em;color:var(--ice)}
.nav{display:flex;gap:4px;min-width:0;margin-inline:auto;overflow-x:auto;scrollbar-width:none}
.nav a{white-space:nowrap;padding:9px 13px;border-radius:999px;color:var(--dust);font:500 13.5px/1 var(--f-body);text-decoration:none}
.nav a:hover{color:var(--star)}
.nav a[aria-current="page"]{color:var(--star);background:rgba(166,220,255,.1);box-shadow:inset 0 0 0 1px rgba(166,220,255,.35)}
.lang{display:flex;padding:2px;border:1px solid var(--line-2);border-radius:999px}
.lang button{padding:7px 10px;border:0;border-radius:999px;background:none;color:var(--dust);font:500 12px/1 var(--f-body);cursor:pointer}
.lang button:hover{color:var(--star)}
.lang button[aria-pressed="true"]{background:var(--star);color:var(--void)}
@media (max-width:760px){
  .nav{order:3;flex:1 0 100%;margin-inline:0}
  .lang{margin-left:auto}
}

/* ---------- channel icons ---------- */
.icons{display:flex;flex-wrap:wrap;gap:10px}
.ico{flex:none;display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line-2);border-radius:50%;background:rgba(255,255,255,.03);color:var(--star);transition:color .2s,border-color .2s,box-shadow .2s}
.ico svg{width:19px;height:19px}
a.ico:hover,a.ico:focus-visible{color:var(--ice);border-color:var(--ice);box-shadow:0 0 18px -4px var(--ice);outline:none}

/* ---------- home: the universe ---------- */
.home{display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr);gap:clamp(24px,4vw,56px);align-items:center;min-height:calc(100vh - 72px);min-height:calc(100svh - 72px);padding-block:clamp(16px,3vw,32px)}
@media (max-width:880px){.home{grid-template-columns:minmax(0,1fr);min-height:0;padding-block:28px 48px}}
.home h1{display:flex;flex-direction:column;gap:14px;margin:0}
.home h1 .cjk{font-weight:900;font-size:clamp(84px,12.5vw,164px);line-height:.92;letter-spacing:.03em;text-shadow:0 0 42px rgba(166,220,255,.35)}
.home h1 .latin{font:300 clamp(13px,1.5vw,15px)/1 var(--f-display);letter-spacing:.42em;color:var(--ice)}
.home .icons{margin-top:30px;max-width:380px}

.system-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.system{position:relative;width:min(100%,680px);aspect-ratio:1;container-type:inline-size}
@media (min-width:881px){.system{width:min(100%,680px,calc(100vh - 150px));width:min(100%,680px,calc(100svh - 150px))}}
.system::before{content:"";position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,rgba(166,220,255,.13),transparent 70%)}
.ring{position:absolute;left:50%;top:50%;z-index:2;width:calc(var(--r) * 2%);aspect-ratio:1;translate:-50% -50%;border:1px solid var(--line);border-radius:50%;animation:spin var(--T) linear infinite;transition:border-color .3s;pointer-events:none}
.ring:has(.planet:hover),.ring:has(.planet:focus-visible){border-color:var(--line-2)}
.yr{position:absolute;left:50%;top:calc(50% - var(--r) * 1%);z-index:1;translate:-50% -50%;font:500 clamp(8px,1.6cqw,11px)/1 var(--f-mono);letter-spacing:.06em;color:var(--dust);pointer-events:none}
.planet{position:absolute;width:6.8cqw;aspect-ratio:1;translate:-50% -50%;padding:0;border:0;border-radius:50%;background:var(--panel);cursor:pointer;pointer-events:auto;animation:unspin var(--T) linear infinite;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 0 1.8cqw rgba(166,220,255,.28);transition:scale .25s,box-shadow .25s}
.planet img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover}
.planet:hover,.planet:focus-visible{scale:1.5;outline:none;box-shadow:0 0 0 2px var(--ice),0 0 3cqw rgba(166,220,255,.6)}
.system:hover .ring,.system:hover .planet,.system:focus-within .ring,.system:focus-within .planet{animation-play-state:paused}
.core{position:absolute;left:50%;top:50%;z-index:3;width:18cqw;aspect-ratio:1;translate:-50% -50%;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line-2),0 0 0 1.4cqw rgba(166,220,255,.06),0 0 9cqw rgba(166,220,255,.38);transition:box-shadow .3s}
.core:hover,.core:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ice),0 0 0 1.4cqw rgba(166,220,255,.1),0 0 11cqw rgba(166,220,255,.55)}
.core img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
@keyframes spin{to{rotate:360deg}}
@keyframes unspin{to{rotate:-360deg}}
.readout{margin:0;min-height:1.7em;max-width:100%;text-align:center;font:400 12.5px/1.7 var(--f-mono);color:var(--dust);overflow-wrap:anywhere}
.readout b{font:600 15px var(--f-cjk);color:var(--star)}

/* ---------- inner pages ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:30px;padding-block:clamp(32px,6vw,64px) 22px;border-bottom:1px solid var(--line)}
.page-head h2{margin:8px 0 0;font:600 clamp(30px,5vw,52px)/1.05 var(--f-display)}
.view{padding-bottom:24px}
.search{position:relative;flex:0 1 320px;min-width:0}
.search input{width:100%;box-sizing:border-box;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.04);color:var(--star);font:400 14px var(--f-body)}
.search input::placeholder{color:var(--dust)}
.search input:focus{outline:none;border-color:var(--ice)}
.search svg{position:absolute;left:13px;top:50%;translate:0 -50%;width:14px;height:14px;fill:none;stroke:var(--dust);stroke-width:2}
@media (max-width:620px){.search{flex-basis:100%}}
.empty{padding-block:48px;text-align:center;color:var(--dust)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:30px 20px}
@media (max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}}
.grid-mv{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
@media (max-width:480px){.grid-mv{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;gap:5px;min-width:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.card:focus-visible{outline:none}
.art{position:relative;display:block;aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:8px;background:var(--panel);box-shadow:0 0 0 1px var(--line);transition:translate .25s,box-shadow .25s}
.art img{display:block;width:100%;height:100%;object-fit:cover}
.card:hover .art,.card:focus-visible .art{translate:0 -4px;box-shadow:0 0 0 1px var(--ice),0 16px 30px -12px rgba(166,220,255,.45)}
.v-stages .card:hover .art,.v-stages .card:focus-visible .art{box-shadow:0 0 0 1px var(--flare),0 16px 30px -12px rgba(255,197,138,.4)}
.ttl{margin-top:8px;font:600 15px/1.35 var(--f-cjk);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font:400 11.5px/1.5 var(--f-mono);color:var(--dust);font-variant-numeric:tabular-nums}
.with{overflow:hidden;font-size:12px;color:var(--dust);white-space:nowrap;text-overflow:ellipsis}
.badge{position:absolute;left:8px;top:8px;z-index:2;padding:3px 8px;border-radius:4px;background:rgba(5,6,12,.8);font:500 11px/1.25 var(--f-body);color:var(--mist)}
.badge.ep,.badge.dance,.badge.perf{color:var(--flare)}
.badge.mv{color:var(--ice)}
.mvc .art{aspect-ratio:16/9}
.mvc .art::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;translate:-50% -50%;border-radius:50%;background:rgba(5,6,12,.55);box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.mvc .art::before{content:"";position:absolute;z-index:1;left:50%;top:50%;width:14px;height:16px;translate:-35% -50%;background:var(--star);clip-path:polygon(0 0,100% 50%,0 100%)}

.show-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px;margin-bottom:48px}
.show-card{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);color:var(--star);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s}
.show-card:hover,.show-card:focus-visible{border-color:var(--flare);outline:none}
.show-card b{font:700 17px/1.3 var(--f-cjk)}
.show-card span{font-size:12.5px;color:var(--dust)}
.show-card em{font:500 11.5px/1.6 var(--f-mono);font-style:normal;color:var(--flare)}
.show{margin-top:44px;scroll-margin-top:96px}
.show:first-child{margin-top:0}
.show-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:18px}
.show-head h3{margin:0;font:700 22px/1.25 var(--f-cjk)}
.show-head .sub{font-size:13px;color:var(--dust)}
.show-head .tag{padding:5px 10px;border:1px solid rgba(255,197,138,.35);border-radius:999px;font:500 11.5px/1 var(--f-mono);color:var(--flare)}

.appear{margin-top:64px}
.alist{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.alist li{display:grid;grid-template-columns:7em minmax(0,1fr) auto;gap:2px 18px;align-items:baseline;padding-block:13px;border-bottom:1px solid var(--line)}
.alist time{font:400 12px/1.6 var(--f-mono);color:var(--dust);font-variant-numeric:tabular-nums}
.alist b{font:600 15px/1.45 var(--f-cjk);overflow-wrap:anywhere}
.alist .perf{display:block;margin-top:2px;font-size:13px;color:var(--dust)}
.alist .type{padding:4px 9px;border:1px solid var(--line-2);border-radius:999px;font:500 11px/1 var(--f-body);color:var(--mist);white-space:nowrap}
@media (max-width:560px){.alist li{grid-template-columns:minmax(0,1fr) auto}.alist time{grid-column:1 / -1}}

.pill-links{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border:1px solid var(--line-2);border-radius:999px;color:var(--star);font:500 13px/1 var(--f-body);text-decoration:none}
.pill svg{width:16px;height:16px}
.pill:hover,.pill:focus-visible{border-color:var(--ice);color:var(--ice);outline:none}

/* ---------- artist ---------- */
.artist{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:start;padding-block:clamp(36px,6vw,72px) 8px}
@media (max-width:760px){.artist{grid-template-columns:minmax(0,1fr)}}
.portrait{display:block;width:100%;max-width:300px;aspect-ratio:1;object-fit:cover;object-position:50% 20%;border-radius:50%;box-shadow:0 0 0 1px var(--line-2),0 0 0 14px rgba(166,220,255,.04),0 0 80px rgba(166,220,255,.25)}
.artist-name{display:flex;flex-direction:column;gap:12px;margin:12px 0 0}
.artist-name .cjk{font-weight:900;font-size:clamp(56px,8vw,96px);line-height:.95}
.artist-name .latin{font:300 13px/1 var(--f-display);letter-spacing:.3em;color:var(--ice)}
.bio{max-width:62ch;margin:22px 0 0;color:var(--mist);font-size:16px;line-height:1.75}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 28px;margin:26px 0 0}
.facts div{padding-block:10px;border-top:1px solid var(--line)}
.facts dt{font:500 11px/1.5 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.facts dd{margin:3px 0 0;font-size:14.5px}
.mini{margin:32px 0 0;font:500 11px/1.5 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:14px}
.chan{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02);color:var(--star);text-decoration:none;transition:border-color .2s}
.chan:hover,.chan:focus-visible{border-color:var(--ice);outline:none}
.chan:hover .ico{color:var(--ice);border-color:var(--ice)}
.chan > span:last-child{min-width:0}
.chan b{display:block;font-size:14px;font-weight:600}
.chan small{display:block;font:400 11.5px/1.4 var(--f-mono);color:var(--dust);overflow-wrap:anywhere}
.block{padding-top:clamp(48px,7vw,80px)}
.block-head{margin:0 0 4px;padding-bottom:14px;border-bottom:1px solid var(--line);font:600 clamp(20px,2.6vw,26px)/1.25 var(--f-display);text-wrap:balance}
.timeline{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:5em minmax(0,1fr);gap:20px;padding-block:18px;border-bottom:1px solid var(--line)}
.timeline .y{font:500 15px/1.7 var(--f-mono);color:var(--ice)}
.timeline p{max-width:66ch;margin:0;color:var(--mist)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips:empty{display:none}
.chip{padding:7px 12px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--star);font:500 13px/1.1 var(--f-cjk);cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--ice);outline:none}
.chip.show-chip{border-color:rgba(255,197,138,.4);color:var(--flare)}
.chip.show-chip:hover{border-color:var(--flare)}
.streams > p{max-width:60ch;margin:18px 0 6px;color:var(--mist)}
.streams dl{display:flex;flex-direction:column;margin:0}
.streams dl div{display:grid;grid-template-columns:12em minmax(0,1fr);gap:4px 20px;padding-block:14px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.streams dl div{grid-template-columns:minmax(0,1fr)}}
.streams dt{font-weight:600}
.streams dd{margin:0;color:var(--dust);font-size:14px}

/* ---------- listening room ---------- */
.nav a.live::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;vertical-align:2px;border-radius:50%;background:var(--flare);box-shadow:0 0 8px var(--flare)}
.room{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.room{grid-template-columns:minmax(0,1fr)}}
.player{display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;align-self:flex-start;padding:3px;border:1px solid var(--line-2);border-radius:999px}
.seg button{padding:8px 14px;border:0;border-radius:999px;background:none;color:var(--dust);font:500 13px/1 var(--f-body);cursor:pointer}
.seg button:hover{color:var(--star)}
.seg button[aria-pressed="true"]{background:var(--star);color:var(--void)}
.hint{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:rgba(166,220,255,.05);color:var(--mist);font-size:13.5px}
.hint a{color:var(--ice);text-underline-offset:3px}
.np{display:grid;grid-template-columns:96px minmax(0,1fr);gap:18px;align-items:center}
.np img{display:block;width:96px;aspect-ratio:1;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line-2),0 0 30px rgba(166,220,255,.3)}
.np img.wide{aspect-ratio:16/9;border-radius:8px}
.np img.spin{animation:spin 24s linear infinite}
.np h3{margin:0;font:700 22px/1.3 var(--f-cjk);overflow-wrap:anywhere}
.np .sub{margin:4px 0 0;font:400 12px/1.5 var(--f-mono);color:var(--dust)}
.np-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.np-row .chip{padding:5px 11px;font:500 12px/1.2 var(--f-body)}
.pill-st{display:inline-block;padding:5px 11px;border:1px solid var(--line-2);border-radius:999px;color:var(--mist);font-size:12px}
.pill-st.ok{border-color:rgba(166,220,255,.5);color:var(--ice)}
.pill-st.warn{border-color:rgba(255,197,138,.55);color:var(--flare)}
.embed-sp{min-height:80px}
.embed-sp iframe{display:block;width:100%;border:0;border-radius:12px}
.embed-yt{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:12px;background:var(--panel)}
.embed-yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.blocked{margin:0;padding:12px 14px;border:1px dashed rgba(255,197,138,.5);border-radius:10px;color:var(--flare);font-size:13.5px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.ctl{padding:8px 14px;border:1px solid var(--line-2);border-radius:999px;background:none;color:var(--star);font:500 13px/1 var(--f-body);cursor:pointer}
.ctl:hover{border-color:var(--ice)}
.loop{display:inline-flex;align-items:center;gap:8px;color:var(--mist);font-size:13px;cursor:pointer}
.loop input{accent-color:var(--ice)}
.controls .seg{margin-left:auto}
.queue{max-height:440px;margin:0;padding:0;overflow:auto;list-style:none;border:1px solid var(--line);border-radius:12px}
.queue button{display:grid;grid-template-columns:2em 40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--star);font:inherit;text-align:left;cursor:pointer}
.queue li:last-child button{border-bottom:0}
.queue.q-yt button{grid-template-columns:2em 64px minmax(0,1fr) auto}
.queue button:hover{background:rgba(255,255,255,.04)}
.queue .on button{background:rgba(166,220,255,.09)}
.queue img{display:block;width:40px;height:40px;border-radius:6px;object-fit:cover}
.queue.q-yt img{width:64px;height:36px}
.qx{display:flex;flex-direction:column;min-width:0}
.qt{overflow:hidden;font:600 14px/1.35 var(--f-cjk);white-space:nowrap;text-overflow:ellipsis}
.qs{overflow:hidden;font:400 11.5px/1.4 var(--f-mono);color:var(--dust);white-space:nowrap;text-overflow:ellipsis}
.qn,.qd{font:400 12px var(--f-mono);color:var(--dust);font-variant-numeric:tabular-nums}
.queue .on .qn{color:var(--ice)}
.music{display:flex;flex-direction:column;gap:16px;min-width:0}

const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
let lang = 'en';
try { const saved = localStorage.getItem('anqi-lang'); if (LANGS.includes(saved)) lang = saved; } catch(_) {}
const t = (k, ...a) => { const v = T[lang][k]; return typeof v === 'function' ? v(...a) : v; };
const tx = v => v == null ? '' : typeof v === 'object' ? v[lang] : v;
const all = v => v == null ? '' : typeof v === 'object' ? Object.values(v).join(' ') : v;
const num = n => n.toLocaleString(lang === 'vi' ? 'vi-VN' : 'en-US');
const dur = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
const day = d => d.replace(/-/g,'.');
const fold = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base = s => s.replace(/\s*-\s*(B版|练习室版)?Live$/,'').replace(/\s*[（(][^）)]*[）)]/g,'').trim();
const shortWith = w => { const a = w.split(', '); return a.length > 3 ? a.slice(0,3).join(', ') + ' +' + (a.length-3) : w; };
const showName = sh => lang === 'zh' ? sh.name : sh[lang];

const FIND = {
  yt:   q => 'https://www.youtube.com/results?search_query=' + enc(q),
  bili: q => 'https://search.bilibili.com/all?keyword=' + enc(q),
  qq:   q => 'https://y.qq.com/n/ryqq/search?w=' + enc(q),
  ncm:  q => 'https://music.163.com/#/search/m/?s=' + enc(q) + '&type=1',

/* ---------- router ---------- */
const VIEWS = ['home','listen','artist','songs','stages','mv'];
let view = 'home';
function go(v, push = true){
  if (!VIEWS.includes(v)) v = 'home';
  view = v;
  document.querySelectorAll('[data-view]').forEach(s => s.hidden = s.dataset.view !== v);
  document.querySelectorAll('#nav a').forEach(a => a.dataset.go === v ? a.setAttribute('aria-current','page') : a.removeAttribute('aria-current'));
  $('footer').hidden = v === 'home';
  drawMore();
  window.scrollTo(0, 0);
  if (v === 'listen') initListen();
  if (push) { try { history.pushState(null, '', viewUrl(v)); } catch(_) {} }
}
const viewUrl = v => v === 'home' ? location.pathname + location.search : v === 'listen' && L.src === 'live' ? '#live' : '#' + v;
const homeOf = it => it.type === 'song' ? 'songs' : it.type === 'live' ? 'stages' : 'mv';
// a hash is either a page (#songs) or one song, stage or video (#s-ice, #l-<spotify id>, #m-<youtube id>)
function route(hash){
  if (ITEMS[hash]) { go(homeOf(ITEMS[hash]), false); openItem(hash); return; }
  if (sheet.open) sheet.close();
  if (hash === 'live') { go('listen', false); setSrc('live'); return; }
  go(hash, false);
}
addEventListener('popstate', () => route(location.hash.slice(1)));
addEventListener('hashchange', () => route(location.hash.slice(1)));

function drawMore(){
  $('more').innerHTML = VIEWS.filter(v => v !== view).map(v =>
    `<a href="#${v === 'home' ? '' : v}" data-go="${v}"><b>${t('nav.' + v)}</b><span>${t('more.d')[v]}</span></a>`).join('');
}

/* ---------- orbit system: one ring per year, inner = 2020 (built once) ---------- */
(function(){
  const sys = $('system'), readout = $('readout');
  const YEARS = [2020,2021,2022,2023,2024,2025,2026];
  YEARS.forEach((y,i) => {
    const r = 16 + i*4.85;
    const period = (60 * Math.pow(r/16, 1.5)).toFixed(1) + 's';
    const lab = document.createElement('span');
    lab.className = 'yr'; lab.style.setProperty('--r', r - 2.4); lab.textContent = y;
    sys.appendChild(lab);
    const ring = document.createElement('div');
    ring.className = 'ring'; ring.style.setProperty('--r', r); ring.style.setProperty('--T', period);
    const list = SONGS.filter(s => s.d.startsWith(String(y))).sort((a,b) => a.d < b.d ? -1 : 1);
    list.forEach((s,j) => {
      const a = (i*47 + j*360/list.length - 90) * Math.PI/180;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'planet'; b.dataset.open = 's-'+s.k;
      b.style.left = (50 + 50*Math.cos(a)).toFixed(3) + '%';
      b.style.top  = (50 + 50*Math.sin(a)).toFixed(3) + '%';
      b.setAttribute('aria-label', s.t + ', ' + day(s.d));
      b.innerHTML = `<img src="covers/${s.c}.jpg" alt="">`;
      const show = () => readout.innerHTML = `<b>${esc(s.t)}</b> · ${day(s.d)} · ${dur(s.s)}`;
      b.addEventListener('mouseenter', show);
      b.addEventListener('focus', show);
      b.addEventListener('blur', () => readout.textContent = '');
      ring.appendChild(b);
    });
    sys.appendChild(ring);
  });
  sys.addEventListener('mouseleave', () => readout.textContent = '');
})();

/* ---------- cards ---------- */
function card(key){
  const it = ITEMS[key];
  if (it.type === 'song') {
    const h = fold([it.t, all(it.w), all(it.note), ...LANGS.map(l => T[l].kind[it.kind]), it.d].join(' '));
    return `<button type="button" class="card" data-open="${key}" data-h="${esc(h)}">
      <span class="art"><img loading="lazy" src="${it.img}" alt=""></span>
      <span class="ttl">${esc(it.t)}</span>
      <span class="meta">${day(it.d)} · ${dur(it.s)}</span>
      ${it.w ? `<span class="with">${t('with')}${esc(shortWith(tx(it.w)))}</span>` : ''}
    </button>`;
  }
  if (it.type === 'live') {
    const h = fold([it.t, it.w, it.ep, it.show.name, it.show.en, it.show.vi, it.show.y].join(' '));
    return `<button type="button" class="card" data-open="${key}" data-h="${esc(h)}">
      <span class="art"><img loading="lazy" src="${it.img}" alt=""><span class="badge ep">${esc(t('ep', it.ep))}</span></span>
      <span class="ttl">${esc(base(it.t) || it.t)}</span>
      <span class="meta">${dur(it.s)}${it.p ? ' · ' + t('plays', num(it.p)) : ''}</span>
      <span class="with">${it.w ? t('with') + esc(shortWith(it.w)) : t('solo')}</span>
    </button>`;
  }
  return `<button type="button" class="card mvc" data-open="${key}">
    <span class="art"><img loading="lazy" src="${it.img}" alt=""><span class="badge ${it.type}">${t('mvtype')[it.type]}</span></span>
    <span class="ttl">${esc(it.t)}</span>
    <span class="meta">${day(it.d)} · ${t('views', num(it.v))}</span>
  </button>`;
}

/* ---------- search ---------- */
function filter(v){
  const sec = document.querySelector(`[data-view="${v}"]`);
  const inp = sec.querySelector('input[type="search"]');
  const raw = inp.value.trim(), q = fold(raw);
  let n = 0;
  sec.querySelectorAll('.card, .hit').forEach(c => { const ok = !q || c.dataset.h.includes(q); c.hidden = !ok; if (ok) n++; });
  sec.querySelectorAll('.show').forEach(g => g.hidden = !g.querySelector('.card:not([hidden])'));
  const ap = sec.querySelector('.appear'); if (ap) ap.hidden = !ap.querySelector('.hit:not([hidden])');
  const idx = sec.querySelector('.show-index'); if (idx) idx.hidden = !!q;
  const al = sec.querySelector('.album'); if (al) al.hidden = !!q;
  const e = sec.querySelector('.empty'); e.hidden = n > 0; if (!n) e.textContent = t('empty', raw);
}
$('q-songs').addEventListener('input', () => filter('songs'));
$('q-stages').addEventListener('input', () => filter('stages'));

/* ---------- listening room: YouTube IFrame API (anyone) + Spotify iFrame API (logged-in listeners) ---------- */

function loadScript(src){

function ensureSpotify(){

function onSpUpdate(e){
  if (L.src !== 'sp') return;
  const d = e.data || {}, it = listOf('sp')[L.idx.sp];
  const was = L.playing;
  L.playing = !d.isPaused;
  if (L.playing) L.started = true;
  // previews are cut to 30 s, so a short duration on a long song means the listener is not logged in
  if (d.duration > 0) L.mode = d.duration < 31000 && it.s > 40 ? 'preview' : 'full';
  drawNow();
  if (was !== L.playing) drawQueue();
  if (Date.now() - L.loadedAt > 2000 && d.duration > 0 && d.position >= d.duration - 1000) {
    const key = L.list.sp + ':' + L.idx.sp;

function ensureYT(){
  if (L.ytState) return;

  window.onYouTubeIframeAPIReady = () => {
    ytPlayer = new YT.Player('yt-embed', {

      playerVars:{rel:0, playsinline:1},

        onReady:() => { ytReady = true; },
        onStateChange:e => {
          if (L.src !== 'yt') return;
          if (e.data === 1) { L.started = true; L.playing = true; }
          else if (e.data === 2) L.playing = false;
          else if (e.data === 0) { L.playing = false; next(true); }

function playAt(i){
  L.idx[L.src] = i;

    if (ytReady) ytPlayer.loadVideoById(it.yt); else ensureYT();
  } else {

// "Play in the listening room" from any page: pick a source and list that has the item, then start it
function playInRoom(key){
  if (sheet.open) sheet.close();
  if (view !== 'listen') go('listen');
  if (key === 'album') { if (L.src === 'live') setSrc('yt'); setList('album'); playAt(0); return; }
  const it = ITEMS[key]; if (!it) return;
  const inAlbum = src => L.list[src] === 'album' && LISTS[src].album.some(x => x.key === key);
  let src, list;
  if (it.type === 'mv') { src = 'yt'; list = 'mv'; }
  else if (it.type === 'live') { src = 'sp'; list = 'live'; }
  else if (L.src !== 'sp' && it.ytm) { src = 'yt'; list = inAlbum('yt') ? 'album' : 'songs'; }
  else { src = 'sp'; list = inAlbum('sp') ? 'album' : 'songs'; }
  setSrc(src);
  setList(list);
  playAt(Math.max(0, items().findIndex(x => x.key === key)));
}
function next(auto){
  let i = curIdx() + 1;

}
function pauseCurrent(){

}
function setSrc(src){

/* ---------- fan chat UI (the Firebase module below fills it in) ---------- */
const chatUI = {
  send:null, share:null, drop:null, screen:null, list:null, lives:null, screens:null, livesErr:false, uid:null,
  hours:LIVE_HOURS, screenCfg:SCREEN,
  state: FIREBASE_CONFIG ? 'chat.connecting' : 'chat.soon',
  off(k){ this.state = k; this.send = this.share = this.drop = this.screen = null; drawChat(); drawLives(); },
  ready(send, share, drop, screen){ Object.assign(this, {send, share, drop, screen}); this.state = null; drawChat(); drawLives(); },
  render(list, uid){ this.list = list; this.uid = uid; drawChat(); },

window.chatUI = chatUI;
window.FIREBASE_CONFIG = FIREBASE_CONFIG;
const pad2 = n => String(n).padStart(2, '0');
function when(ms){
  const d = new Date(ms), now = new Date();
  const hm = pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  return d.toDateString() === now.toDateString() ? hm : `${d.getFullYear()}.${pad2(d.getMonth()+1)}.${pad2(d.getDate())} ${hm}`;
}
function drawChat(){
  const box = $('msgs'), off = $('chat-off'), k = chatUI.state;

  $('chat-form').hidden = !chatUI.send;
  box.hidden = !!k;

  box.innerHTML = list.length ? list.map(m => `<li class="msg${m.uid === chatUI.uid ? ' me' : ''}">
    <div class="mh"><b>${esc(m.name || '')}</b><time>${when(m.at)}</time></div>
    ${m.song ? m.song.startsWith('🔴') ? `<span class="ms ml">${esc(m.song)}</span>` : `<span class="ms">♪ ${esc(m.song)}</span>` : ''}<p>${esc(m.text || '')}</p></li>`).join('')
    : `<li class="chat-empty">${t('chat.empty')}</li>`;
  if (near || !drawChat.scrolled) { box.scrollTop = box.scrollHeight; drawChat.scrolled = true; }

try { $('chat-name').value = localStorage.getItem('anqi-chat-name') || ''; } catch(_) {}
$('chat-form').addEventListener('submit', async e => {

/* ---------- fan lives: links fans share from events (the Firebase module below fills them in) ---------- */
const hostOf = url => { try { const h = new URL(url).hostname; return LIVE_HOSTS.find(p => p.re.test(h)) || null; } catch(_) { return null; } };
// the first link in what was pasted (apps share "text + link + text"), only from the platforms above
function liveUrl(text){
  const m = String(text).match(/https?:\/\/[^\s"'<>，。！？、】）]+/);
  if (!m) return '';
  let u; try { u = new URL(m[0].replace(/^http:/i, 'https:')); } catch(_) { return ''; }
  return !u.username && !u.password && !u.port && u.href.length <= 300 && hostOf(u.href) ? u.href : '';
}
// only official embeddable players: YouTube and Bilibili
function embedOf(url){
  let u; try { u = new URL(url); } catch(_) { return ''; }
  const h = u.hostname.replace(/^(www|m)\./, '');
  let id = h === 'youtu.be' ? u.pathname.slice(1)
    : /(^|\.)youtube\.com$/.test(h) ? u.searchParams.get('v') || (u.pathname.match(/^\/(?:live|shorts|embed)\/([\w-]{11})/) || [])[1] : '';
  if (/^[\w-]{11}$/.test(id || '')) return 'https://www.youtube.com/embed/' + id + '?autoplay=1&playsinline=1';
  if (h === 'live.bilibili.com' && (id = (u.pathname.match(/^\/(?:h5\/)?(\d+)/) || [])[1])) return 'https://www.bilibili.com/blackboard/live/live-activity-player.html?cid=' + id + '&quality=0';
  if (h === 'bilibili.com' && (id = (u.pathname.match(/\/video\/(BV\w{10})/) || [])[1])) return 'https://player.bilibili.com/player.html?bvid=' + id + '&autoplay=0';
  return '';
}
// screen shares in progress (the sharer's page checks in every minute), then shared links
function fanLives(){
  const now = Date.now();
  const screens = (chatUI.screens || []).filter(x => x.on && x.at > now - 3 * 60e3).map(x => ({...x, id:'scr-' + x.uid, screen:true}));
  return screens.concat((chatUI.lives || []).filter(x => x.at > now - LIVE_HOURS * 3600e3 && hostOf(x.url)));
}
const H = {stream:null, viewers:0, busy:false, leave:null};   // my own screen share, and the one I'm watching
function drawLives(){
  const live = L.src === 'live', box = $('fan-player'), list = fanLives();
  const on = live && !H.stream ? list.find(x => x.id === L.watch) : null;
  const key = !live ? '' : H.stream ? 'me' : on ? (on.screen ? on.id + ':' + on.sid : embedOf(on.url)) : '';
  // keep the player while the same live is on, so list updates don't restart it
  if (box.dataset.src !== key) {
    if (H.leave) { H.leave(); H.leave = null; }
    box.dataset.src = key;
    box.innerHTML = key === 'me' ? '<video muted autoplay playsinline></video>'
      : on && on.screen ? '<video autoplay playsinline controls></video><p class="scr-msg"></p>'
      : key ? `<iframe src="${esc(key)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>` : '';
    if (key === 'me') box.firstChild.srcObject = H.stream;
    else if (on && on.screen) watchScreen(on, box);
  }
  box.hidden = !key;
  drawHost();
  if (!live) return;
  const k = chatUI.state === 'chat.error' || chatUI.livesErr ? 'lives.error' : chatUI.state ? 'lives.off' : list.length ? '' : 'lives.empty';
  $('fanlives').innerHTML = k ? `<li class="fl-empty">${t(k)}</li>` : list.map(x => {
    if (x.screen) return `<li class="fl${on && on.id === x.id ? ' on' : ''}"><span class="ico">${ICON.screen}</span>
      <span class="fx"><b>${esc(x.title || '')}</b><small>${t('scr.kind')} · ${esc(x.name || '')}</small></span>
      ${x.uid === chatUI.uid ? `<span class="pill-st ok">${t('scr.you')}</span>`
        : `<button type="button" class="ctl go" data-watch="${x.id}" data-n="${esc(x.name || '')}">${t('lives.watch')}</button>`}</li>`;
    const p = hostOf(x.url), embed = embedOf(x.url);
    return `<li class="fl${on && on.id === x.id ? ' on' : ''}"><span class="ico">${ICON[p.k]}</span>
      <span class="fx"><b>${esc(x.title || '')}</b><small>${p.n} · ${esc(x.name || '')} · ${when(x.at)}</small></span>
      ${embed ? `<button type="button" class="ctl go" data-watch="${esc(x.id)}" data-n="${p.n}">${t('lives.watch')}</button>` : ''}
      <a class="ctl${embed ? '' : ' go'}" href="${esc(x.url)}" target="_blank" rel="noopener" data-pop="${p.n}">${t('lives.open')}</a>
      ${x.uid === chatUI.uid || (chatUI.screen && chatUI.screen.host) ? `<button type="button" class="ctl" data-drop="${esc(x.id)}">${t('lives.drop')}</button>` : ''}</li>`;
  }).join('');
}
function watchScreen(x, box){
  const video = box.querySelector('video'), msg = box.querySelector('.scr-msg');
  const say = (k, ...a) => { msg.textContent = k ? t(k, ...a) : ''; };
  if (!chatUI.screen) return;
  say('scr.joining');
  const timer = setTimeout(() => say('scr.fail'), 25000);
  const leave = chatUI.screen.watch(x.uid, x.sid, stream => {
    video.srcObject = stream;
    // sound needs a tap on some phones: start muted there and let the controls unmute
    video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
  }, state => {
    if (state === 'connected') { clearTimeout(timer); say(''); }
    else if (state === 'full') { clearTimeout(timer); say('scr.full', SCREEN.max); }
    else if (state === 'failed') { clearTimeout(timer); say('scr.fail'); }
  }, d => caption(video, d.vi || d.zh));
  H.leave = () => { clearTimeout(timer); leave(); };
}
function drawHost(){
  const s = chatUI.screen, box = $('host-box');
  box.hidden = !s || L.src !== 'live';
  if (box.hidden) return;
  $('host-note').innerHTML = s.host ? t('host.how') : t('host.ask', esc(s.uid));
  $('host-ctl').hidden = !s.host;
  if (!s.host) return;
  if (!box.dataset.opened) { box.open = true; box.dataset.opened = '1'; }
  const can = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
  $('scr-note').textContent = !can ? t('scr.device') : H.stream ? t('scr.on', H.viewers, SCREEN.max) : t('scr.how', SCREEN.max);
  $('host-go').hidden = $('sub-row').hidden = !can;
  $('host-go').textContent = t(H.stream ? 'scr.stop' : 'scr.start');
  $('host-go').disabled = H.busy;
  $('host-sub').disabled = !SUBS_OK;
  $('sub-status').textContent = !can ? '' : !SUBS_OK ? t('sub.need') : SUB.msg ? t(...SUB.msg) : '';
}
$('host-go').addEventListener('click', async () => {
  const st = $('host-status'), s = chatUI.screen;
  st.textContent = '';
  if (!s) return;
  if (H.stream) { s.stop(); return; }
  const name = $('chat-name').value.trim(), what = $('host-what').value.trim();
  if (!what) { st.textContent = t('lives.needWhat'); $('host-what').focus(); return; }
  if (!name) { st.textContent = $('chat-status').textContent = t('chat.needName'); $('chat-name').focus(); return; }
  try { localStorage.setItem('anqi-chat-name', name); } catch(_) {}
  // the translator may need a download, which Chrome only allows right after a click
  const sub = SUBS_OK && $('host-sub').checked;
  if (sub) subsPrepare();
  H.busy = true; drawHost();
  try {
    H.stream = await s.start(name.slice(0, 24), what.slice(0, 80),
      n => { H.viewers = n; drawHost(); },
      () => {
        H.stream = null; H.viewers = 0; subsStop();
        if (SUB.msg && SUB.msg[0] === 'sub.on') SUB.msg = ['sub.ready'];
        drawLives();
      });
    if (sub) subsStart(H.stream);
  } catch (err) {
    console.error(err);
    // closing the picker is not an error
    if (!err || err.name !== 'NotAllowedError') st.textContent = t('scr.error');
  } finally { H.busy = false; drawLives(); }
});
$('host-sub').addEventListener('change', e => {
  if (!e.target.checked) { subsStop(); subSay(''); return; }
  subsPrepare().then(() => { if (!H.stream) subSay('sub.ready'); }, () => {});
  if (H.stream) subsStart(H.stream);
});

/* ---------- auto Vietnamese subtitles for a shared screen ----------
   Runs in the sharer's browser: the Web Speech API listens to the shared tab (Chrome 135+, Edge) and the
   built-in Translator turns the Chinese into Vietnamese on the computer (Chrome 138+, Edge 148+). The lines go to
   viewers along with the picture and show as captions on the video. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const SUBS_OK = !!(SR && window.Translator);
const SUB = {rec:null, tr:null, ready:null, msg:null, job:'', busy:false};
const subSay = (k, ...a) => { SUB.msg = k ? [k, ...a] : null; drawHost(); };
const tail = (s, n) => s.length <= n ? s : '…' + s.slice(-n).replace(/^\S*\s/, '');
// a caption on the video: the CC button hides it, and it stays in full screen
function caption(video, text){
  if (!video) return;
  let tr = video.subTrack;
  if (!tr) { tr = video.subTrack = video.addTextTrack('subtitles', 'Tiếng Việt', 'vi'); tr.mode = 'showing'; }
  [...(tr.cues || [])].forEach(c => tr.removeCue(c));
  if (text) tr.addCue(new VTTCue(video.currentTime, video.currentTime + 7, text));
}
function subsPrepare(){
  if (!SUB.ready) {
    SUB.ready = (async () => {
      const langs = {sourceLanguage: 'zh', targetLanguage: 'vi'};
      if (await Translator.availability(langs) === 'unavailable') throw new Error('unavailable');
      return Translator.create({...langs, monitor(m){ m.addEventListener('downloadprogress', e => subSay('sub.dl', Math.round(e.loaded * 100))); }});
    })();
    SUB.ready.catch(err => {
      console.error(err);
      SUB.ready = null; $('host-sub').checked = false;
      subSay(err.message === 'unavailable' ? 'sub.unavailable' : 'sub.fail');
    });
  }
  return SUB.ready;
}
function subsSend(zh, vi){
  const text = tail(vi || zh, 120);
  if (chatUI.screen) chatUI.screen.caption({zh: tail(zh, 80), vi: text});
  if (H.stream) caption($('fan-player').querySelector('video'), text);
}
// translate the newest line; while one is being translated, only the latest waiting line is kept
async function subsPump(){
  if (SUB.busy || !SUB.job) return;
  const zh = SUB.job;
  SUB.job = ''; SUB.busy = true;
  try { const vi = await SUB.tr.translate(zh); if (SUB.rec) subsSend(zh, vi); }
  catch (err) { console.error(err); }
  SUB.busy = false;
  subsPump();
}
async function subsStart(stream){
  const track = stream.getAudioTracks()[0];
  if (!track) { subSay('sub.noAudio'); return; }
  let tr;
  try { tr = await subsPrepare(); } catch (_) { return; }
  if (H.stream !== stream || SUB.rec) return;
  const rec = new SR();
  rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let zh = '';
    for (let i = e.resultIndex; i < e.results.length; i++) zh += e.results[i][0].transcript;
    if (zh.trim()) { SUB.job = zh.trim(); subsPump(); }
  };
  rec.onerror = e => {
    // silence and network hiccups just restart; anything else stops the subtitles
    if (['no-speech', 'aborted', 'network'].includes(e.error)) return;
    console.error('speech recognition:', e.error);
    subsStop(); $('host-sub').checked = false; subSay('sub.fail');
  };
  // the browser ends a recognition session now and then: start a new one while still sharing
  rec.onend = () => setTimeout(() => {
    if (SUB.rec === rec && track.readyState === 'live') { try { rec.start(track); } catch (_) {} }
  }, 500);
  SUB.rec = rec; SUB.tr = tr;
  try { rec.start(track); subSay('sub.on'); }
  catch (err) { console.error(err); SUB.rec = null; subSay('sub.fail'); }
}
function subsStop(){
  const rec = SUB.rec;
  SUB.rec = null; SUB.job = '';
  if (!rec) return;
  try { rec.abort(); } catch (_) {}
  subsSend('', '');
}
// drop screens whose sharer went quiet and links older than LIVE_HOURS
setInterval(() => { if (L.src === 'live') drawLives(); }, 60e3);

// on a computer, Douyin, Weibo and TikTok open in a small window beside the chat; on phones the link opens the app
const popup = matchMedia('(min-width: 900px) and (pointer: fine)');
$('live-box').addEventListener('click', e => {
  const w = e.target.closest('[data-watch]'), d = e.target.closest('[data-drop]'), a = e.target.closest('[data-pop]');
  if (w) {

    if (chatUI.drop) chatUI.drop(d.dataset.drop).catch(err => console.error(err));
  } else if (a) {
    L.liveOn = a.dataset.pop;
    if (popup.matches) { e.preventDefault(); window.open(a.href, 'anqi-live', 'popup,noopener,width=460,height=820'); }
  }
});
$('share-form').addEventListener('submit', async e => {
  e.preventDefault();
  const st = $('host-status'), name = $('chat-name').value.trim(), what = $('host-what').value.trim();
  const url = liveUrl($('share-url').value);
  st.textContent = '';
  if (!url) { st.textContent = t('lives.bad'); $('share-url').focus(); return; }
  if (!what) { st.textContent = t('lives.needWhat'); $('host-what').focus(); return; }
  // the nickname comes from the chat box, so say it there too
  if (!name) { st.textContent = $('chat-status').textContent = t('chat.needName'); $('chat-name').focus(); return; }
  if (!chatUI.share) return;
  try { localStorage.setItem('anqi-chat-name', name); } catch(_) {}
  const btn = $('share-send'); btn.disabled = true;
  try { await chatUI.share(name.slice(0, 24), what.slice(0, 80), url); $('share-url').value = ''; }

  finally { btn.disabled = false; }
});

/* ---------- starfield ---------- */
(function(){
  const c = $('stars'), ctx = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, stars = [], last = 0, timer;
  function init(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    c.width = W*dpr; c.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.min(420, Math.round(W*H/4200));
    stars = Array.from({length:n}, () => ({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random() < .93 ? Math.random()*.9 + .2 : Math.random()*1.1 + 1,
      a:Math.random()*.55 + .25, f:Math.random()*1.6 + .4, p:Math.random()*6.283, h:Math.random()
    }));
    draw(performance.now());
  }
  function draw(time){
    ctx.clearRect(0,0,W,H);
    for (const s of stars){
      ctx.globalAlpha = s.a * (still ? 1 : .62 + .38*Math.sin(time/1000*s.f + s.p));
      ctx.fillStyle = s.h < .07 ? '#ffd9b0' : s.h < .2 ? '#cfe9ff' : '#ffffff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
  }
  function loop(time){ if (time - last > 50 && !document.hidden){ draw(time); last = time; } requestAnimationFrame(loop); }
  init();
  addEventListener('resize', () => { clearTimeout(timer); timer = setTimeout(init, 150); });
  if (!still) requestAnimationFrame(loop);
})();
</script>

<!-- fan chat: Firebase anonymous sign-in + Firestore (rules in firestore.rules) -->
<script type="module">
const cfg = window.FIREBASE_CONFIG, ui = window.chatUI;
if (cfg) {
  try {
    const src = 'https://www.gstatic.com/firebasejs/10.12.2/';
    const [{initializeApp}, {getAuth, signInAnonymously}, fs] = await Promise.all([
      import(src + 'firebase-app.js'), import(src + 'firebase-auth.js'), import(src + 'firebase-firestore.js'),
    ]);
    const app = initializeApp(cfg);
    const db = fs.getFirestore(app);
    const {user} = await signInAnonymously(getAuth(app));
    const withAt = d => { const m = d.data({serverTimestamps:'estimate'}); return {...m, at: m.at ? m.at.toMillis() : Date.now()}; };
    const msgs = fs.collection(db, 'rooms', 'main', 'messages');
    fs.onSnapshot(fs.query(msgs, fs.orderBy('at', 'desc'), fs.limit(100)), snap => {
      ui.render(snap.docs.map(withAt).reverse(), user.uid);
    }, err => { console.error(err); ui.off('chat.error'); });
    // fan lives and screen shares from the last few hours
    const since = fs.Timestamp.fromMillis(Date.now() - ui.hours * 3600e3);
    const lives = fs.collection(db, 'rooms', 'main', 'lives');
    fs.onSnapshot(fs.query(lives, fs.where('at', '>', since), fs.orderBy('at', 'desc'), fs.limit(30)), snap => {
      ui.renderLives(snap.docs.map(d => ({...withAt(d), id: d.id})), user.uid);
    }, err => { console.error(err); ui.renderLives([], user.uid, true); });
    const screens = fs.collection(db, 'rooms', 'main', 'screens');
    fs.onSnapshot(fs.query(screens, fs.where('at', '>', since)), snap => {
      ui.renderScreens(snap.docs.map(withAt));
    }, err => console.error(err));
    // people listed in /hosts (added by the site manager) may share their screen
    const host = await fs.getDoc(fs.doc(db, 'hosts', user.uid)).then(d => d.exists(), () => false);

    ui.ready(async (name, text, song) => {
      // one message per 3 s per visitor: the rules compare this timestamp with the previous one
      const batch = fs.writeBatch(db);
      batch.set(fs.doc(db, 'posters', user.uid), {at: fs.serverTimestamp()});
      const m = {name, text, uid: user.uid, at: fs.serverTimestamp()};
      if (song) m.song = song;
      batch.set(fs.doc(msgs), m);
      await batch.commit();
    }, async (name, title, url) => {
      // one shared live per minute per visitor, checked the same way
      const batch = fs.writeBatch(db);
      batch.set(fs.doc(db, 'sharers', user.uid), {at: fs.serverTimestamp()});
      batch.set(fs.doc(lives), {name, title, url, uid: user.uid, at: fs.serverTimestamp()});
      await batch.commit();
    }, id => fs.deleteDoc(fs.doc(lives, id)), screenShare(fs, db, screens, user.uid, host));
  } catch (err) {
    console.error(err);
    ui.off('chat.error');
  }
}

/* Screen sharing. The sharer's browser sends the shared tab straight to each viewer over WebRTC.
   Firestore only carries the connection details: a viewer asks in screens/{sharer}/peers/{viewer},
   the sharer writes an offer there and the viewer writes back an answer. */
function screenShare(fs, db, screens, uid, host){
  const conf = ui.screenCfg, ice = {iceServers: conf.ice};
  // send the connection details in one go once the network addresses are gathered
  const gathered = pc => new Promise(done => {
    if (pc.iceGatheringState === 'complete') return done();
    const timer = setTimeout(done, 3000);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(timer); done(); } });
  });
  let end = null, chans = new Map(), last = '';
  return {
    host, uid,
    async start(name, title, onViewers, onEnd){
      const stream = await navigator.mediaDevices.getDisplayMedia({
        video: {frameRate: {ideal: 24, max: 30}, width: {ideal: 1280}, height: {ideal: 720}},
        audio: true, selfBrowserSurface: 'exclude', systemAudio: 'include',
      });
      const video = stream.getVideoTracks()[0];
      if (video) video.contentHint = 'motion';
      const sid = Math.random().toString(36).slice(2, 12);
      const me = fs.doc(screens, uid), peers = fs.collection(me, 'peers'), pcs = new Map(), chs = chans = new Map();
      const count = () => onViewers([...pcs.values()].filter(pc => pc.connectionState === 'connected').length);
      const drop = id => { const pc = pcs.get(id); chs.delete(id); if (pc) { pc.close(); pcs.delete(id); count(); } };
      try { await fs.setDoc(me, {name, title, uid, sid, on: true, at: fs.serverTimestamp()}); }
      catch (err) { stream.getTracks().forEach(t => t.stop()); throw err; }
      const stopPeers = fs.onSnapshot(peers, snap => snap.docChanges().forEach(async ch => {
        const id = ch.doc.id, d = ch.doc.data();
        if (ch.type === 'removed') return drop(id);
        if (d.sid !== sid) return;
        try {
          if (!d.offer && !d.full) {
            // a viewer asks to watch (again)
            drop(id);
            if (pcs.size >= conf.max) return await fs.updateDoc(ch.doc.ref, {full: true});
            const pc = new RTCPeerConnection(ice);
            pcs.set(id, pc);
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            // subtitles travel on a data channel; a new viewer gets the current line straight away
            const dc = pc.createDataChannel('subs');
            dc.onopen = () => { if (last) dc.send(last); };
            chs.set(id, dc);
            pc.onconnectionstatechange = () => { if (pc.connectionState === 'failed') drop(id); else count(); };
            await pc.setLocalDescription(await pc.createOffer());
            await gathered(pc);
            if (pcs.get(id) === pc) await fs.updateDoc(ch.doc.ref, {offer: pc.localDescription.sdp});
          } else if (d.answer && pcs.get(id) && pcs.get(id).signalingState === 'have-local-offer') {
            const pc = pcs.get(id);
            await pc.setRemoteDescription({type: 'answer', sdp: d.answer});
            // cap each viewer's video so the sharer's upload holds up
            pc.getSenders().forEach(sn => {
              if (!sn.track || sn.track.kind !== 'video') return;
              const p = sn.getParameters();
              if (p.encodings && p.encodings[0]) { p.encodings[0].maxBitrate = conf.bitrate; sn.setParameters(p).catch(() => {}); }
            });
          }
        } catch (err) { console.error(err); drop(id); }
      }), err => console.error(err));
      // check in every minute so a closed tab drops off everyone's list
      const beat = setInterval(() => fs.updateDoc(me, {at: fs.serverTimestamp()}).catch(() => {}), 60e3);
      end = () => {
        end = null; chans = new Map(); last = '';
        clearInterval(beat); stopPeers();
        removeEventListener('pagehide', stop);
        pcs.forEach((pc, id) => { pc.close(); fs.deleteDoc(fs.doc(peers, id)).catch(() => {}); });
        pcs.clear();
        stream.getTracks().forEach(t => t.stop());
        fs.deleteDoc(me).catch(() => {});
        onEnd();
      };
      const stop = () => { if (end) end(); };
      if (video) video.addEventListener('ended', stop);   // "Stop sharing" in the browser bar
      addEventListener('pagehide', stop);
      return stream;
    },
    stop(){ if (end) end(); },
    caption(line){
      last = JSON.stringify(line);
      chans.forEach(ch => { if (ch.readyState === 'open') ch.send(last); });
    },
    watch(sharer, sid, onStream, onState, onCaption){
      const ref = fs.doc(screens, sharer, 'peers', uid);
      let pc = null, quit = false, stopDoc = () => {};
      const fail = err => { console.error(err); if (!quit) onState('failed'); };
      fs.setDoc(ref, {sid, at: fs.serverTimestamp()}).then(() => {
        if (quit) return;
        stopDoc = fs.onSnapshot(ref, async snap => {
          const d = snap.data();
          if (quit || !d || d.sid !== sid) return;
          if (d.full) return onState('full');
          if (!d.offer || pc) return;
          try {
            pc = new RTCPeerConnection(ice);
            pc.ontrack = e => onStream(e.streams[0]);
            pc.ondatachannel = e => { e.channel.onmessage = m => { try { onCaption(JSON.parse(m.data)); } catch (_) {} }; };
            pc.onconnectionstatechange = () => onState(pc.connectionState);
            await pc.setRemoteDescription({type: 'offer', sdp: d.offer});
            await pc.setLocalDescription(await pc.createAnswer());
            await gathered(pc);
            if (!quit) await fs.updateDoc(ref, {answer: pc.localDescription.sdp});
          } catch (err) { fail(err); }
        }, fail);
      }, fail);
      return () => { quit = true; stopDoc(); if (pc) pc.close(); fs.deleteDoc(ref).catch(() => {}); };
    },
  };
}
</script>
